<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>归档双版本运行检查</title><style>body{font:13px system-ui;margin:20px}button{padding:8px 12px}iframe{width:390px;height:350px;border:1px solid #ddd}#frames{display:flex;flex-wrap:wrap}pre{white-space:pre-wrap}li[data-fail=true]{color:#b22}</style><h1>归档双版本运行检查</h1><button id="run">检查所有组件</button><p id="status">待运行</p><div id="frames"></div><ol id="results"></ol><script type="module">
const status=document.querySelector('#status'),results=document.querySelector('#results'),frames=document.querySelector('#frames');
document.querySelector('#run').onclick=async()=>{
 document.querySelector('#run').disabled=true;results.replaceChildren();
 const index=await(await fetch('/archive/index.json')).json();const entries=index.records.filter(r=>r.section==='components');let count=0,failures=0;const details=[];
 const jobs=entries.flatMap(r=>['original','project'].map(variant=>({r,variant,url:variant==='original'?r.originalPreviewUrl:r.localPreviewUrl})));
 async function worker(){while(jobs.length){const job=jobs.shift(),frame=document.createElement('iframe');frame.title=job.r.id+' '+job.variant;frames.append(frame);const loaded=new Promise(resolve=>frame.onload=resolve);frame.src=job.url;await loaded;await new Promise(resolve=>setTimeout(resolve,180));const doc=frame.contentDocument;const controls=doc.querySelectorAll('button,input,textarea,select,[role=button],[role=slider],[tabindex="0"]');const text=doc.body.innerText.trim();const imgs=[...doc.images].filter(i=>!i.complete||!i.naturalWidth).length;const external=frame.contentWindow.performance.getEntriesByType('resource').map(e=>e.name).filter(x=>/^https?:/.test(x)&&!x.startsWith(location.origin));const state=doc.body.dataset.previewStatus;const fail=doc.documentElement.scrollWidth>doc.documentElement.clientWidth+2||state!=='ready'||!doc.querySelector('#root')?.children.length||imgs||external.length;const row={id:job.r.id,variant:job.variant,state,controls:controls.length,overflow:doc.documentElement.scrollWidth>doc.documentElement.clientWidth+2,imgs,external,text:text.slice(0,160)};details.push(row);if(fail)failures++;const li=document.createElement('li');li.dataset.fail=String(!!fail);li.textContent=JSON.stringify(row);results.append(li);frame.remove();count++;status.textContent=`${count}/${entries.length*2} · ${failures} failed`;}}
 await Promise.all([worker(),worker(),worker()]);window.archivePreviewResults=details;status.dataset.done='true';document.querySelector('#run').disabled=false;
};
</script></html>
